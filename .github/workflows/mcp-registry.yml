name: MCP Registry

# Lists @verse8/mcp on the official MCP Registry
# (https://registry.modelcontextprotocol.io) as io.github.planetarium/verse8-mcp.
#
# Run it after `npm publish` of a version that carries `mcpName` (0.10.1+):
# from the Actions tab (workflow_dispatch) or by pushing a `v*` tag. Signing in
# uses GitHub OIDC from this repository, which is what grants the
# io.github.planetarium/* namespace — no personal token or org-owner login.
# Directories that follow the registry pick the server up from there.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    name: Publish server.json
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MCP_PUBLISHER_VERSION: v1.8.8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: server.json matches package.json
        run: node --test tests/unit/serverJson.test.mjs

      - name: Wait for this version on npm, with mcpName
        run: |
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').mcpName")"
          for attempt in $(seq 1 30); do
            published="$(npm view "@verse8/mcp@${version}" mcpName 2>/dev/null || true)"
            if [ "$published" = "$name" ]; then
              echo "@verse8/mcp@${version} is on npm with mcpName ${published}"
              exit 0
            fi
            echo "waiting for @verse8/mcp@${version} with mcpName (attempt ${attempt})"
            sleep 20
          done
          echo "::error::@verse8/mcp@${version} is not on npm with mcpName=${name}; run npm publish first"
          exit 1

      - name: Install mcp-publisher
        run: |
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_${os}_${arch}.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --help > /dev/null

      - name: Sign in (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
